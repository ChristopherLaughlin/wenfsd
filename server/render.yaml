# Render blueprint — deploy with one click via "New + → Blueprint" pointing at this repo.
# (Railway is similar: create a service from /server, add a Postgres plugin, set env vars.)
services:
  - type: web
    name: wenfsd
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8787
      - key: MOCK_MODE
        value: "false"
      - key: PUBLIC_BASE_URL
        value: https://wenfsd.com
      - key: SESSION_SECRET
        generateValue: true
      - key: TESLA_CLIENT_ID
        sync: false
      - key: TESLA_CLIENT_SECRET
        sync: false
      - key: TESLA_REDIRECT_URI
        value: https://wenfsd.com/auth/callback
      - key: TESLA_FLEET_BASE
        value: https://fleet-api.prod.na.vn.cloud.tesla.com
      - key: TESLA_AUDIENCE
        value: https://fleet-api.prod.na.vn.cloud.tesla.com
      - key: DATABASE_URL
        fromDatabase:
          name: wenfsd-db
          property: connectionString

databases:
  - name: wenfsd-db
    plan: free
