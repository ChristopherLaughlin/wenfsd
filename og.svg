<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f16"/>
      <stop offset="1" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6394b"/>
      <stop offset="1" stop-color="#39d4ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <!-- content lives in the centre 1200x630 band (y 285..915); the PNG is cropped to that band -->
  <g stroke="#161b26" stroke-width="1">
    <line x1="0" y1="443" x2="1200" y2="443"/><line x1="0" y1="601" x2="1200" y2="601"/><line x1="0" y1="759" x2="1200" y2="759"/>
  </g>
  <path d="M80 800 C 360 800, 420 650, 600 565 S 900 435, 1120 420" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <!-- logo + wordmark -->
  <rect x="80" y="333" width="80" height="80" rx="19" fill="#e6394b"/>
  <text x="120" y="392" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
  <text x="178" y="392" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#f4f6fb">wen<tspan fill="#e6394b">FSD</tspan></text>
  <!-- headline -->
  <text x="80" y="540" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#f4f6fb">Predict your next Tesla</text>
  <text x="80" y="620" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#39d4ff">software &amp; FSD<tspan fill="#f4f6fb"> update</tspan></text>
  <!-- subline -->
  <text x="80" y="685" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#8b95a8">By VIN. A probability date with an 80% confidence window.</text>
  <!-- call to action -->
  <rect x="80" y="735" width="430" height="62" rx="31" fill="#e6394b"/>
  <text x="295" y="775" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">Add by VIN — it's free →</text>
  <text x="540" y="775" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#5fd1a0">wenfsd.info</text>
  <!-- footer -->
  <text x="80" y="868" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#5f6878">no login  ·  read-only  ·  open source</text>
</svg>
