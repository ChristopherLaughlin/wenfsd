name: CodeQL
# Static security analysis (free on public repos — no GitHub Pro needed).
# Findings appear under the repo's Security ▸ Code scanning tab and annotate PRs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * *" # daily, so newly-published query packs catch existing code

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # required to upload results to code scanning
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 — SHA-pinned (supply-chain)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: javascript-typescript
          # Default query suite (omit `queries:`) — GitHub's recommended merge gate. We
          # deliberately don't use `security-extended` as a *blocking* gate: its lower-precision
          # heuristics flag framework patterns as "high" (e.g. rate-limiting on a static og.png
          # route, loop-bounds on an internal Monte-Carlo constant). The genuinely real findings
          # it surfaced have been fixed in code (regex precedence, scraper sanitisation, log
          # injection, session reset on auth, same-origin CSRF guard, catch-all rate limiter).
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        with:
          category: "/language:javascript-typescript"
